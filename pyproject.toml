[project]
name = "icpc-tutor"
version = "0.1.0"
description = "Tutor de ICPC/SBC no Discord que dá dicas sem entregar código aceito."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes `llm` chamam modelos (custo e rede): ficam fora por padrão e do CI.
# Para rodá-los: `uv run pytest -m llm` (o -m da linha de comando prevalece).
addopts = ["-m", "not llm", "--strict-markers"]
markers = [
    "llm: chama um modelo de linguagem; roda só com `-m llm`",
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
